<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Fondo circular sutil -->
  <circle cx="400" cy="400" r="300" fill="#F7F8FA"/>

  <!-- Documento -->
  <g transform="translate(250, 200)">
    <rect x="0" y="0" width="300" height="400" rx="20" fill="#FFFFFF" stroke="#18202C" stroke-width="20"/>
    <!-- Líneas de texto simulado -->
    <line x1="50" y1="80" x2="250" y2="80" stroke="#D5DCE4" stroke-width="16" stroke-linecap="round"/>
    <line x1="50" y1="140" x2="200" y2="140" stroke="#D5DCE4" stroke-width="16" stroke-linecap="round"/>
    <line x1="50" y1="200" x2="250" y2="200" stroke="#D5DCE4" stroke-width="16" stroke-linecap="round"/>
    <line x1="50" y1="260" x2="150" y2="260" stroke="#D5DCE4" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Bolígrafo (Naranja) -->
  <g transform="translate(480, 480) rotate(45)">
    <rect x="0" y="0" width="40" height="160" rx="10" fill="#E85D04"/>
    <polygon points="0,160 40,160 20,200" fill="#18202C"/>
  </g>
</svg>