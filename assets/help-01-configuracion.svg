<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Fondo circular sutil -->
  <circle cx="400" cy="400" r="300" fill="#F7F8FA"/>
  
  <!-- Engranaje (Acero Grafito) -->
  <g stroke="#18202C" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="400" cy="400" r="120"/>
    <circle cx="400" cy="400" r="40"/>
    <!-- Dientes del engranaje -->
    <path d="M 400 220 v 40 M 400 540 v 40 M 220 400 h 40 M 540 400 h 40"/>
    <path d="M 272 272 l 28 28 M 500 500 l 28 28 M 528 272 l -28 28 M 300 500 l -28 28"/>
  </g>

  <!-- Toggle de ajuste (Naranja Técnico) -->
  <rect x="520" y="500" width="140" height="70" rx="35" fill="#E85D04"/>
  <circle cx="625" cy="535" r="25" fill="#FFFFFF"/>
</svg>